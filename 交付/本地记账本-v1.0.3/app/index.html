        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="school"><span class="nav-ic">&#8203;</span><span>学校</span></button>
        <button class="nav-item" data-view="dashboard"><span class="nav-ic">&#8203;</span><span>总览</span></button>
        <button class="nav-item" data-view="transactions"><span class="nav-ic">&#8203;</span><span>明细</span></button>
        <button class="nav-item" data-view="stats"><span class="nav-ic">&#8203;</span><span>统计</span></button>
        <button class="nav-item" data-view="budget"><span class="nav-ic">&#8203;</span><span>预算</span></button>

        <div class="side-foot">v1.0.3 · 完全离线</div>
      </div>

        <div class="topbar-title">
          <h1 id="view-title">总览</h1>
          <p id="view-sub"></p>
        </div>
        <div class="top-actions">
          <div class="month-picker">
            <button id="month-prev" class="icon-btn" title="上个月">&#8203;</button>
            <button id="month-cur" class="month-cur">2026年9月</button>
            <button id="month-next" class="icon-btn" title="下个月">&#8203;</button>
          </div>
          <button id="btn-theme" class="icon-btn" title="切换深浅色">&#8203;</button>
          <button id="btn-backup" class="icon-btn" title="导出备份">&#8203;</button>
        </div>
      </header>

      <section id="view-root" class="view-root"></section>
    </main>
